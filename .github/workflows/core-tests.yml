name: Office core tests
on:
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'test/**'
      - 'tools/check.mjs'
      - 'package.json'
      - '.github/workflows/core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'test/**'
      - 'tools/check.mjs'
      - 'package.json'
      - '.github/workflows/core-tests.yml'
permissions:
  contents: read
concurrency:
  group: office-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, pinned
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Module check (syntax, whitespace, no process execution in src/)
        run: npm run check
      - name: Tests
        run: npm test
